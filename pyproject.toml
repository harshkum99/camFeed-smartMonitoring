[project]
name = "sanjay"
version = "0.1.0"
description = "Project Sanjay — Surveillance Intelligence Platform"
# Proprietary. Declared explicitly so our own package does not show up as
# "declares no licence" in the licence gate's output and train people to skim it.
license = "LicenseRef-Proprietary"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]
survey = ["onvif-zeep-async>=3.1", "av>=13"]

[project.scripts]
sanjay-survey = "sanjay.survey.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sanjay"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` and `Header(...)` in a signature default is FastAPI's dependency-injection
# idiom, not the mutable-default bug B008 exists to catch. Declared here rather than scattering
# noqa comments through every route.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
