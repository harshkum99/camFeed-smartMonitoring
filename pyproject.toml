[project]
name = "smartcam"
version = "0.1.0"
description = "Smart Cam Monitoring — Surveillance Intelligence Platform"
# Proprietary. Declared explicitly so our own package does not show up as
# "declares no licence" in the licence gate's output and train people to skim it.
license = "LicenseRef-Proprietary"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    # Evidence bundles: the API renders the draft section 63 certificate. Both BSD/HPND.
    "reportlab>=4.2",
    "pillow>=11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]
survey = ["onvif-zeep-async>=3.1", "av>=13"]
# Array code used by ingest and its tests. Kept apart from onnxruntime so CI can test every ingest
# module with fake detectors without installing the inference runtime.
analysis = ["numpy>=2.0", "scipy>=1.13", "pillow>=11"]
# Running real detection on recorded footage. The API and console never need this.
ingest = ["smartcam[analysis]", "onnxruntime>=1.20"]

[project.scripts]
smartcam-survey = "smartcam.survey.cli:main"
smartcam-import = "smartcam.ingest.cli:main"
smartcam-ingest = "smartcam.ingest.ingest_cli:main"
smartcam-evidence = "smartcam.evidence.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartcam"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` and `Header(...)` in a signature default is FastAPI's dependency-injection
# idiom, not the mutable-default bug B008 exists to catch. Declared here rather than scattering
# noqa comments through every route.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
